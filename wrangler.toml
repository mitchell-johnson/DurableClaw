name = "durable-claw"
main = "src/server.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[ai]
binding = "AI"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/agents/*"]

[[durable_objects.bindings]]
name = "NANO_CHAT_AGENT"
class_name = "NanoChatAgent"

[[durable_objects.bindings]]
name = "RESEARCH_SUBAGENT"
class_name = "ResearchSubagent"

[[r2_buckets]]
binding = "WORKSPACE"
bucket_name = "durable-claw-workspace"

[[d1_databases]]
binding = "CONTROL_DB"
database_name = "durable-claw-control"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Keep v1: existing agent objects retain their identity and stored data.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NanoChatAgent"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ResearchSubagent"]

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
CHAT_MODEL = ""
BACKGROUND_MODEL = ""
BATCH_MODEL = ""
PROACTIVE_DISABLED = "false"
